name: Deploy GORILLA MCP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Provision D1 and KV and configure Wrangler
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-resources.mjs
      - name: Apply D1 schema
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute gorilla-control-db --remote --file=./schema.sql
      - name: Configure pairing and owner secrets
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEVICE_PAIRING_CODE: ${{ secrets.DEVICE_PAIRING_CODE }}
          OWNER_PASSPHRASE: ${{ secrets.OWNER_PASSPHRASE }}
        shell: bash
        run: |
          test -n "$DEVICE_PAIRING_CODE"
          test -n "$OWNER_PASSPHRASE"
          printf '%s' "$DEVICE_PAIRING_CODE" | npx wrangler secret put DEVICE_PAIRING_CODE
          printf '%s' "$OWNER_PASSPHRASE" | npx wrangler secret put OWNER_PASSPHRASE
      - name: Deploy Worker
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
